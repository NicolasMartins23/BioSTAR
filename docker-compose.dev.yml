services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biostar}
      POSTGRES_USER: ${POSTGRES_USER:-biostar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biostar}
    volumes:
      - biostar-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      BIOSTAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biostar}:${POSTGRES_PASSWORD:-biostar}@db:5432/${POSTGRES_DB:-biostar}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BIOSTAR_ENV: dev
      BIOSTAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biostar}:${POSTGRES_PASSWORD:-biostar}@db:5432/${POSTGRES_DB:-biostar}
      BIOSTAR_ALLOWED_ORIGINS: ${BIOSTAR_ALLOWED_ORIGINS}
      BIOSTAR_PUBLIC_URL: ${BIOSTAR_PUBLIC_URL}
      BIOSTAR_AUTH_ADMIN_KEY: ${BIOSTAR_AUTH_ADMIN_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "BioStarAPI.app:app", "--host", "0.0.0.0", "--port", "8000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      BIOSTAR_DOMAIN: ${BIOSTAR_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^BIOSTAR_DOMAIN$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  biostar-postgres-dev:
