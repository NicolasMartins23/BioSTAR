services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      BIOSTAR_DATABASE_URL: sqlite:////data/biostar.db
    volumes:
      - biostar-sqlite-dev:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BIOSTAR_ENV: dev
      BIOSTAR_DATABASE_URL: sqlite:////data/biostar.db
      BIOSTAR_ALLOWED_ORIGINS: ${BIOSTAR_ALLOWED_ORIGINS}
      BIOSTAR_PUBLIC_URL: ${BIOSTAR_PUBLIC_URL}
      BIOSTAR_AUTH_ADMIN_KEY: ${BIOSTAR_AUTH_ADMIN_KEY}
    volumes:
      - biostar-sqlite-dev:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      BIOSTAR_DOMAIN: ${BIOSTAR_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^BIOSTAR_DOMAIN$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  biostar-sqlite-dev:
