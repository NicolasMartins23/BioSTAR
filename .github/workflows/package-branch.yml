name: Package branch

on:
  push:
    branches:
      - refactor/engine-architecture

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: zip -r BioSTAR-refactor-engine-architecture.zip . -x ".git/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BioSTAR-refactor-engine-architecture
          path: BioSTAR-refactor-engine-architecture.zip
