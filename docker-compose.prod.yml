services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biostar}
      POSTGRES_USER: ${POSTGRES_USER:-biostar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - biostar-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      BIOSTAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biostar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-biostar}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BIOSTAR_ENV: prod
      BIOSTAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biostar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-biostar}
      BIOSTAR_ALLOWED_ORIGINS: ${BIOSTAR_ALLOWED_ORIGINS}
      BIOSTAR_PUBLIC_URL: ${BIOSTAR_PUBLIC_URL}
      BIOSTAR_AUTH_ADMIN_KEY: ${BIOSTAR_AUTH_ADMIN_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: ["uvicorn", "BioStarAPI.app:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/biostar"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      BIOSTAR_DOMAIN: ${BIOSTAR_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^BIOSTAR_DOMAIN$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  biostar-postgres-prod:
