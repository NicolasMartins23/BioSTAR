services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      BIOSTAR_DATABASE_URL: sqlite:////data/biostar.db
    volumes:
      - biostar-sqlite-prod:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BIOSTAR_ENV: prod
      BIOSTAR_DATABASE_URL: sqlite:////data/biostar.db
      BIOSTAR_ALLOWED_ORIGINS: ${BIOSTAR_ALLOWED_ORIGINS}
      BIOSTAR_PUBLIC_URL: ${BIOSTAR_PUBLIC_URL}
      BIOSTAR_AUTH_ADMIN_KEY: ${BIOSTAR_AUTH_ADMIN_KEY}
    volumes:
      - biostar-sqlite-prod:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: ["uvicorn", "BioStarAPI.app:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/biostar"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      BIOSTAR_DOMAIN: ${BIOSTAR_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^BIOSTAR_DOMAIN$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  biostar-sqlite-prod:
