[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biostar"
version = "0.2.0"
description = "Object-oriented tools for biological sequence analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "SQLAlchemy>=2.1,<3.0",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["BioStar*", "BioStarAPI*"]

[tool.setuptools.package-data]
"BioStar.data" = ["*.sqlite3.gz"]
