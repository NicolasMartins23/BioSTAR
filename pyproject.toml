[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biostar"
version = "0.2.0"
description = "Object-oriented tools for biological sequence analysis."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["BioStar*"]
